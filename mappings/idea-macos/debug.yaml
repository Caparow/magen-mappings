mapping:
  - id: "ChooseDebugConfiguration"
    binding:
      - "ctrl+alt+[KeyD]"
    idea:
      action: "ChooseDebugConfiguration"
    vscode:
      action: "workbench.action.debug.selectandstart"
    zed:
      action: "debugger::Start"
      context: ["Workspace"]
  - id: "ChooseRunConfiguration"
    binding:
      macos: "ctrl+alt+[KeyR]"
      default: "alt+shift+[F10]"
    idea:
      missing: true
    vscode:
      action: "workbench.action.tasks.runTask"
    zed:
      action: "task::Spawn"
      context: ["Workspace"]
  - id: "Debug"
    binding:
      - "ctrl+[KeyD]"
    idea:
      action: "Debug"
    vscode:
      action: "workbench.action.debug.start"
    zed:
      action: "debugger::Start"
      context: ["Workspace"]
  - id: "Resume"
    binding:
      macos:
        - "meta+alt+[KeyR]"
        - "[F9]"
      default:
        - "ctrl+alt+[KeyR]"
        - "[F9]"
    idea:
      action: "Resume"
    vscode:
      action: "workbench.action.debug.continue"
    zed:
      action: "debugger::Continue"
      context: ["Workspace"]
  - id: "RunToCursor"
    binding:
      - "alt+[F9]"
    idea:
      action: "RunToCursor"
    vscode:
      action: "editor.debug.action.runToCursor"
    zed:
      action: "debugger::RunToCursor"
      context: ["Editor"]
  - id: "ToggleLineBreakpoint"
    binding:
      macos: "meta+[F8]"
      default: "ctrl+[F8]"
    idea:
      action: "ToggleLineBreakpoint"
    vscode:
      action: "editor.debug.action.toggleBreakpoint"
    zed:
      action: "editor::ToggleBreakpoint"
      context: ["Editor"]
  - id: "StepOver"
    binding:
      - "[F8]"
    idea:
      action: "StepOver"
    vscode:
      action: "workbench.action.debug.stepOver"
    zed:
      action: "debugger::StepOver"
      context: ["Workspace"]
  - id: "StepInto"
    binding:
      - "[F7]"
    idea:
      action: "StepInto"
    vscode:
      action: "workbench.action.debug.stepInto"
    zed:
      action: "debugger::StepInto"
      context: ["Workspace"]
  - id: "StepOut"
    binding:
      - "shift+[F8]"
    idea:
      action: "StepOut"
    vscode:
      action: "workbench.action.debug.stepOut"
    zed:
      action: "debugger::StepOut"
      context: ["Workspace"]
  - id: "Stop"
    binding:
      macos: "meta+[F2]"
      default: "ctrl+[F2]"
    idea:
      action: "Stop"
    vscode:
      action: "workbench.action.debug.stop"
    zed:
      action: "debugger::Stop"
      context: ["Workspace"]
