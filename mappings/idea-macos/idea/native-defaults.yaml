# IntelliJ IDEA 2026.2 native macOS keyboard and mouse keymap snapshot.
# Source: the bundled `$default` keymap plus `Mac OS X 10.5+` overrides.
# Keep the baseline complete: IDEA negations clear inherited actions before applying additive tweaks.
mapping:
  - id: "idea.native.$Copy"
    binding:
      macos:
        - "meta+[KeyC]"
        - "meta+[INSERT]"
      default:
        - "ctrl+[KeyC]"
        - "ctrl+[INSERT]"
    idea:
      action: "$Copy"
    vscode:
      missing: true
    zed:
      missing: true
  - id: "idea.native.$Cut"
    binding:
      macos:
        - "meta+[KeyX]"
        - "shift+[delete]"
      default:
        - "ctrl+[KeyX]"
