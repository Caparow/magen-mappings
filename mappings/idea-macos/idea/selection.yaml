mapping:
  - id: "EditorCodeBlockEndWithSelection"
    binding:
      macos: "meta+alt+shift+[BracketRight]"
      default: "ctrl+alt+shift+[BracketRight]"
    idea:
      action: "EditorCodeBlockEndWithSelection"
    vscode:
      missing: true
    zed:
      missing: true
  - id: "EditorCodeBlockStartWithSelection"
    binding:
      macos: "meta+alt+shift+[BracketLeft]"
      default: "ctrl+alt+shift+[BracketLeft]"
    idea:
      action: "EditorCodeBlockStartWithSelection"
    vscode:
      missing: true
    zed:
      missing: true
  - id: "EditorAddCaretPerSelectedLine"
    binding:
      - "alt+shift+[KeyG]"
    idea:
      action: "EditorAddCaretPerSelectedLine"
    vscode:
      missing: true
    zed:
      missing: true
