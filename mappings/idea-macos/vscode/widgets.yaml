mapping:
  # ==== Tier 1 — editor widgets, peeks, find/replace ====
  # Esc collapses multiple cursors back to one. VSCode's default is a bare
  # `textInputFocus`, which relies on internal priority; in a flat keymap that
  # would shadow widget-Esc handlers, so we guard against every editor-overlay
  # widget that also binds Esc (focus-based widgets — statusBar/breadcrumbs/
  # lists/terminal — can't co-occur with editorTextFocus, so they need no guard).
  - id: "removeSecondaryCursors"
    binding:
      - "escape"
      - "shift+escape"
    vscode:
      action: "removeSecondaryCursors"
      context: ["editorTextFocus && !suggestWidgetVisible && !parameterHintsVisible && !findWidgetVisible && !markersNavigationVisible && !referenceSearchVisible && !selectionAnchorSet && !standaloneColorPickerVisible && !callHierarchyVisible && !typeHierarchyVisible && !exceptionWidgetVisible && !dropWidgetVisible && !pasteWidgetVisible && !dirtyDiffVisible && !messageVisible && !inSnippetMode && !editorHasSelection && !codeActionMenuVisible && !renameInputVisible && !breakpointWidgetVisible && !testing.isPeekVisible && !testing.isInPeek"]
    idea:
      missing: true
    zed:
      missing: true
  - id: "editor.action.replaceOne#1"
    binding:
      - "ctrl+shift+1"
    vscode:
      action: "editor.action.replaceOne"
      context: ["editorFocus && findWidgetVisible"]
    idea:
      missing: true
    zed:
      missing: true
  - id: "editor.action.replaceOne#2"
    binding:
      - "enter"
    vscode:
      action: "editor.action.replaceOne"
      context: ["editorFocus && findWidgetVisible && replaceInputFocussed"]
    idea:
      missing: true
    zed:
      missing: true
  - id: "editor.action.replaceAll"
    binding:
      - "ctrl+alt+enter"
    vscode:
      action: "editor.action.replaceAll"
      context: ["editorFocus && findWidgetVisible"]
    idea:
      missing: true
    zed:
      missing: true
  - id: "editor.action.selectAllMatches"
